<!doctype html>
<html lang="de" data-theme="hardware">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novora — Design-Baukasten &amp; Einzelteil-Mockups 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="studioRoot"></div>

  <div class="modal-bg" id="exportModal" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <div class="modal">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <h2 id="exportTitle" style="font-size:15px;font-weight:700">Deine gewählte Design-Kombination</h2>
        <button type="button" class="btn sm" data-action="close-export">Schließen</button>
      </div>
      <p style="font-size:12px;color:var(--text-2)">Kopiere diese Zusammenfassung einfach in den Chat, sobald du dir deinen Favoriten zusammengestellt hast.</p>
      <pre class="export-pre" id="exportText"></pre>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn sm" data-action="close-export">Abbrechen</button>
        <button type="button" class="btn sm primary" data-action="copy-export">In Zwischenablage kopieren</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
