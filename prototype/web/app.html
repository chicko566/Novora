<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Novora">
<meta name="application-name" content="Novora">
<meta name="color-scheme" content="dark">
<title>Novora</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="backBtn" class="iconbtn hidden" title="Zurück" aria-label="Zurück" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="brand">
      <div class="mark"><img src="/icon-192.png" alt="" style="width:100%;height:100%;display:block;border-radius:6px"></div>
      <div><b>Novora</b><small id="sub">…</small></div>
    </div>
    <div class="spacer"></div>
    <span id="lat" class="pill hidden">– ms</span>
    <button id="gear" class="iconbtn" type="button" title="Einstellungen" aria-label="Einstellungen" data-i18n-title="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button id="connectBtn" class="btn-connect" type="button"><i class="dot"></i><span>Verbinden</span></button>
  </header>

  <div id="banner" class="banner" role="status" aria-live="polite"></div>

  <main id="view"></main>
  <nav id="tabs" class="tabbar hidden" aria-label="Seiten" data-i18n-aria="pages"></nav>
</div>

<div id="rotateGate" class="rotate-hint" role="status" aria-live="polite" aria-hidden="true">
  <svg class="rh-ico" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="8" y="3" width="8" height="14" rx="2"/>
    <path d="M4.8 20.6a9.2 9.2 0 0 1 2.7-6.4"/>
    <path d="M4.5 16.9v3.7h3.7"/>
  </svg>
  <span class="rg-title">Gerät quer halten</span>
  <span class="rg-sub">Novora läuft auf dem Handy nur im Querformat.</span>
</div>

<div id="sheet" class="backdrop hidden" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <h4 id="sheetTitle" data-i18n="settings">Einstellungen</h4>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="/iconset.js"></script>
<script src="/vendor/jsqr.js"></script>
<script src="/app.js"></script>
</body>
</html>
