[package]
name = "novora-native"
version = "0.1.0"
edition = "2021"
description = "Novora native preview (Rust/Slint, no WebView)"
publish = false

[dependencies]
slint = "1"

[build-dependencies]
slint-build = "1"

[[bin]]
name = "novora-native"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
